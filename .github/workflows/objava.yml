# Zgradi spletno stran iz vsebin v content/ in jo objavi na GitHub Pages.
# Teče ob vsaki spremembi (tudi ko urednik shrani vsebino) in vsako jutro, da se pretekli dogodki premaknejo sami.
name: Objava strani

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gradnja strani
        run: python tools/build.py
        env:
          AID_DEMO_BASE: /ai-d-demo/
          AID_OUT: ${{ github.workspace }}/_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
